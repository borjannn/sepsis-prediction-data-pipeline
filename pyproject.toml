[project]
name = "sepsis-pipeline"
version = "0.1.0"
description = "ETL pipeline and data warehouse for the PhysioNet/CinC 2019 sepsis dataset"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "polars>=1.30",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pandera[polars]>=0.24",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "rich>=13.9",
    "dbt-core>=1.10",
    "dbt-postgres>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.scripts]
sepsis = "sepsis_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sepsis_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: needs the warehouse database running (docker compose up -d)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
