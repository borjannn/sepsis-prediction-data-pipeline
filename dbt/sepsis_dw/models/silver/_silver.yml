version: 2

models:
  - name: patient_split
    description: >
      Deterministic, stratified (hospital x septic), patient-level split. Built before
      profiling; reads raw directly so it never changes with test vars. Contains is_sepsis for
      stratification only. Never a feature.
    columns:
      - name: patient_id
        data_tests: [unique, not_null]
      - name: split_random
        description: 70/15/15 train/validation/test, stratified by hospital and sepsis status.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['train', 'validation', 'test']
      - name: cv_fold
        description: Patient-level CV fold 1-5 for train patients (NULL otherwise).
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: split_hospital_holdout
        description: Hospital A split 70/30 into train/validation; hospital B is the test set.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['train', 'validation', 'test']

  - name: int_measurement_long
    description: >
      One row per observed clinical value (view). Unit-harmonised, flagged against the seed's
      plausibility (is_out_of_range) and normal (is_abnormal) ranges. Nothing is removed.
    columns:
      - name: variable
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('variable_catalog')
                field: variable
      - name: value
        description: Harmonised value (FiO2 percentages rescaled to fractions).
        data_tests: [not_null]

  - name: int_patient_hour_clean
    description: >
      Wide clean patient-hour table: every hour of every patient, each variable holding its
      in-range value or NULL. Base of all feature models; must never contain label or outcome
      columns (leakage contract, docs/PLAN.md §4.2).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patient_id, iculos]
    columns:
      - name: unit_code
        description: ICU unit from Unit1/Unit2 (MICU, SICU, BOTH, UNKNOWN).
        data_tests:
          - accepted_values:
              arguments:
                values: ['MICU', 'SICU', 'BOTH', 'UNKNOWN']
      - name: static_attr_conflict
        description: True if any static attribute varies within the patient (first row wins).

  - name: int_dq_rejections
    description: Every out-of-range observation with the rule it broke (data-quality report).

  - name: int_patient_hour_imputed
    description: >
      Capped LOCF on the clean values: <var>_measured, <var>_hours_since (uncapped) and
      <var>_last (NULL beyond the seed's locf_max_hours). Past and current hours only.
      Feature model (leakage contract: parents = clean table + seed).
    columns:
      - name: patient_id
        data_tests: [not_null]

  - name: int_patient_hour_features
    description: >
      Causal derived features (keys + derived columns): hemodynamic ratios, SIRS / partial qSOFA
      / partial SOFA with components and availability counts, 6 h and 24 h rolling vitals
      statistics on observed values, 1 h / 6 h deltas, measurement intensity, cumulative
      abnormal counts. Feature model (parents = imputed table + seed).
    columns:
      - name: sofa_partial
        description: Sum of available SOFA components (0-17 here; no CNS, MAP-only cardiovascular).
      - name: sirs_count
        description: Number of SIRS criteria met (0-4) among available components.

  - name: int_patient_sepsis
    description: >
      One row per patient: sepsis outcome and milestones (t_sepsis = first positive row + 6,
      as in the official scoring). OUTCOME data: never a feature.
    columns:
      - name: patient_id
        data_tests: [unique, not_null]

  - name: int_patient_hour_labels
    description: >
      Targets per patient-hour: label_sepsis (official), label_is_sepsis_patient,
      label_hours_to_onset (any horizon), and the challenge utility for predicting
      positive / negative. LABEL data: never a model input.
